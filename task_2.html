<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>

    <h1>Conference Registration Form</h1>

    <form>

        <label for="fullname">FullName:</label>
        <input type="text" id="fullname" name="fullname" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="99" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female" required>
        <label for="female">Female</label><br><br>

        <label for="country">Country of Residence:</label>
        <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="malaysia">Malaysia</option>
            <option value="singapore">Singapore</option>
            <option value="indonesia">Indonesia</option>
            <option value="thailand">Thailand</option>
            <option value="vietnam">Vietnam</option>
        </select>
        <br><br>

        <label for="area">Area of Interest:</label><br>
        <input type="checkbox" name="interest" value="Software Development">Software Development<br>
        <input type="checkbox" name="interest" value="Data Science">Data Science<br>
        <input type="checkbox" name="interest" value="Cybersecurity">Cybersecurity<br>
        <input type="checkbox" name="interest" value="Artificial Intelligence">Artificial Intelligence<br>
        <br><br>

        <label for="experience">Experience Level:</label><br>
        <input type="radio" name="experiencelevel" value="Beginner">Beginner<br>
        <input type="radio" name="experiencelevel" value="Intermediate">Intermediate<br>
        <input type="radio" name="experiencelevel" value="Advanced">Advanced<br>
        <br><br>

        Comments or Questions:<br>
        <textarea name="comments" rows="4" cols="50" placeholder="Any comments or questions?"></textarea><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</head>
<body>

</body>
</html>
